<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Post Composer</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .box {
    background: #fff;
    padding: 24px;
    border-radius: 10px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 2px 8px rgba(119, 57, 57, 0.1);
  }

  h2 {
    margin-top: 0;
  }

  select, textarea {
    width: 100%;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 10px;
    font-family: inherit;
  }

  textarea {
    height: 120px;
    resize: vertical;
  }

  .counter {
    font-size: 13px;
    margin-bottom: 10px;
  }

  .counter.ok { color: green; }
  .counter.warn { color: orange; }

  button {
    padding: 10px 18px;
    background: #1877f2;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }

  button:disabled {
    background: #aaa;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Post Composer</h2>

  <label for="platform">Choose platform (select only one):</label>
  <select id="platform">
    <option value="twitter">Twitter / X (280 chars)</option>
    <option value="instagram">Instagram (2200 chars)</option>
    <option value="linkedin">LinkedIn (3000 chars)</option>
  </select>

  <textarea id="postText" placeholder="Write your post..."></textarea>

  <div id="counter" class="counter ok">0 / 280 characters</div>

  <button id="submitBtn" disabled>Post</button>
</div>

<script>

const LIMITS = {
    twitter: 280,
    instagram: 2200,
    linkedin: 3000
  };

  const platformSelect = document.getElementById("platform");
  const textArea = document.getElementById("postText");
  const counter = document.getElementById("counter");
  const submitBtn = document.getElementById("submitBtn");


  function applyLimit() {
    const platform = platformSelect.value;
    const limit = LIMITS[platform];
    textArea.setAttribute("maxlength", limit);


    if (textArea.value.length > limit) {
      textArea.value = textArea.value.slice(0, limit);
    }
  }

  function updateCounterAndButton() {
    const platform = platformSelect.value;
    const limit = LIMITS[platform];
    const length = textArea.value.length;

    counter.textContent = length + " / " + limit + " characters";
    counter.className = "counter";

    if (length >= limit) {
      counter.classList.add("warn");
      counter.textContent += " — limit reached";
    } else if (length >= limit * 0.9) {
      counter.classList.add("warn");
      counter.textContent += " — almost at the limit";
    } else {
      counter.classList.add("ok");
    }

    submitBtn.disabled = length === 0;
  }

  function refresh() {
    applyLimit();
    updateCounterAndButton();
  }

  textArea.addEventListener("input", updateCounterAndButton);
  platformSelect.addEventListener("change", refresh);

  submitBtn.addEventListener("click", function () {
    alert("Post submitted for " + platformSelect.value + "!");
    textArea.value = "";
    refresh();
  });

  refresh();
</script>

</body>
</html>
